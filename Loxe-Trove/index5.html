<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Confirmation</title>
    <link rel="stylesheet" href="./style5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="payment-section">
        <div class="order-text-container">
            <div class="text-container">
                <div class="icon"><i class="fa-solid fa-check"></i></div>
                <div class="heading-text"><h1>We've received your order</h1></div>
            </div>

            <div class="order-container">
                <div class="order-text">
                    <p>Order #198541512</p>
                </div>
                <div class="order-text">
                    <p>a copy of your receipt has been sent to ********</p>
                </div>
                <div class="order-text">
                    <p>thank you for shopping with Luxetrove</p>
                </div>
            </div>

            <div class="text-container">
                <div class="heading-text"><h2>Give us your feedback</h2></div>
                <div class="icon1"><p>Let us know your experience shopping in our store</p></div>
            </div>
        </div>

        <div class="form-container">
            <form>
                <div class="name-input">
                    <label for="text">Name</label>
                    <input type="text" id="name" >
                </div>

                <div class="name-input">
                    <label for="email">Email</label>
                    <input type="email" id="email" >
                </div>

                <div class="name-input">
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>
                </div>

                <div class="button"><button>Send</button></div>
            </form>
        </div>

        <div class="rate">
            <div class="rate-text"><p>Rate your experience</p></div>
            <div class="star-container">
                <div class="star"><i class="fa-regular fa-star"></i></div>
                <div class="star"><i class="fa-regular fa-star"></i></div>
                <div class="star"><i class="fa-regular fa-star"></i></div>
                <div class="star"><i class="fa-regular fa-star"></i></div>
                <div class="star"><i class="fa-regular fa-star"></i></div>
            </div>
        </div>
    </div>
    
</body>
</html>
