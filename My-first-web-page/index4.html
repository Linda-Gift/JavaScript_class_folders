<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>

<body >
    <h2>Frontend Student Contact Form</h2> <br>
    <form action="http://aa.mccrew.com/cgi-bin/reflect.cgi" method="post">
        <label for="Name">Name</label>
        <input type="text" name="Name" ><br><br>
        <label for="Phone number" >Phone Number</label>
        <input type="number" name="Phone" ><br><br>


        <label for="Gender" >Gender</label>
        <input type="radio" name="Gender" id="Male" value="Male">
        <label for="Male" >Male</label>
        <input type="radio" name="Gender" id="Female" value="Female">
        <label for="Female" >Female</label>
        <input type="radio" name="Gender" id="Any Other" value="Any Other">
        <label for="Any Other" >Any Other</label>

        <br><br>
        <label for="Country" >Country</label>
        <select name="Country" id="Country">
            <option>Select an Option </option>
            <option value="Nigeria" >Nigeria</option>
            <option value="Ghana" >Ghana</option>
            <option value="Zimbabwe">Zimbabwe</option>
            <option value="Sweden">Sweden</option>
            <option value="Australia">Australia</option>
        </select>

        <br><br>
        <label for="Message" >Message</label><br>
        <textarea name="Message"  id="Message" cols="40"
            rows="10">Type your message here</textarea>
        <br><br>
        <input type="Submit" value="Contact Us">
</body>

</html>
