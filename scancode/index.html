<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qr code</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main-container">
        <div class="qr-container">
            <div class="qr-code-image"><img src="./images/image-qr-code.png" alt=""></div>

            <div class="text-container">
                <div class="first-text"><h3>Improve your front-end skills by building projects</h3></div>

                <div class="second-text"><p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p></div>
            </div>
        </div>
    </div>
    
    <script src="./index.js"></script>
</body>
</html>
